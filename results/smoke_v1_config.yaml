# Smoke test (step 0): 1 question, both generators, K=2, both judge configs. Results are never overwritten: a new run needs a new run_id.
run_id: smoke_v1

ollama_url: http://localhost:11434
# Server started as: OLLAMA_MODELS=$PWD/.ollama-models OLLAMA_CONTEXT_LENGTH=8192 ollama serve
ollama_context_length: 8192

dataset:
  name: vibrantlabsai/WikiEval          # formerly explodinggradients/WikiEval
  revision: eae95a2e59d0b20d656360d8e5201016aa870cc1
  page_text_column: context_v2          # the dataset has no full pages (CLAUDE.md 6.1)

questions:
  n: 1
  seed: 42                              # random.Random(seed).sample(range(50), n)

retrieval:
  chunk_size: 1000                      # characters
  chunk_overlap: 200
  embedding_model: BAAI/bge-small-en-v1.5
  k: 4

generation:
  prompt_file: prompts/generation_v1.txt
  # Each generator uses its vendor's recommended sampling (CLAUDE.md 3.3).
  generators:
    proprietary:
      provider: gemini
      model: gemini-3.8-flash
      params: {temperature: 1.0, reasoning_effort: medium}
    open:
      provider: ollama
      model: llama3.1:8b-instruct-q8_0
      params: {temperature: 0.6, top_p: 0.9, seed: 0, num_ctx: 8192}

evaluation:
  judge_model: mistral-small3.2:24b-instruct-2506-q4_K_M
  K: 2
  # Judge follows the Ragas defaults (CLAUDE.md 3.4); seed = j is added per repetition.
  configs:
    default: {}                         # Ragas 0.4.3: temperature 0.01, top_p 0.1, max_tokens 1024
    t1: {temperature: 1.0, top_p: 1.0}
